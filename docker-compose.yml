name: geopulse

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: geopulse-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - geopulse

  nginx:
    image: nginx:1.27-alpine
    container_name: geopulse-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - geopulse

  mysql:
    image: mysql:8.4
    container_name: geopulse-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-33061}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-geopulse}
      MYSQL_USER: ${DB_USERNAME:-geopulse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geopulse

  node:
    image: node:20-alpine
    container_name: geopulse-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "${VITE_PORT:-5174}:5173"
    networks:
      - geopulse
    profiles:
      - tools

networks:
  geopulse:
    driver: bridge

volumes:
  mysql-data:
    driver: local
